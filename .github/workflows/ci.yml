name: RetailCast checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check code quality
        run: python -m ruff check src scripts tests
      - name: Run tests and dependency checks
        run: |
          python -m pytest -q --junitxml=reports/ci-tests.xml
          python -m pip check
      - name: Prepare explicit synthetic CI bundle
        run: python -m src.api.bundle --fixture
      - name: Build container
        run: docker build -t retailcast:ci .
      - name: Start container and check HTTP behavior
        run: |
          docker run -d --name retailcast-ci -p 127.0.0.1:8000:8000 retailcast:ci
          python scripts/smoke_api.py --wait-seconds 60
      - name: Container logs
        if: always()
        run: docker logs retailcast-ci || true
      - name: Stop CI container
        if: always()
        run: docker rm -f retailcast-ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/ci-tests.xml
          if-no-files-found: ignore
